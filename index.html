<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Inscrição para a Banda da Escola</title>
</head>
<body style="background-image: url('https://concerto.com.br/sites/default/files/w-Opes-Karabtchevsky_Daniel-Ebendinger.jpg'); background-size: cover; background-repeat: no-repeat; background-attachment: fixed; color: white; font-family: Arial, sans-serif;">

    <h1>🎸 Teste para a Banda</h1>
    <p>Desenvolver um formulário para a Inscrição para a Banda da Escola, usando nome, idade e instrumento que toca.</p>

    <form style="background-color: rgba(0, 0, 0, 0.75); padding: 20px; display: inline-block; border-radius: 8px;">
        <label>Seu nome:</label><br>
        <input type="text" placeholder="Ex: João Augusto"><br><br>

        <label>Idade:</label><br>
        <input type="text" placeholder="Ex: 16"><br><br>

        <label>Qual instrumento você toca?</label><br>
        <input type="text" placeholder="Ex: Piano, Bateria, Canto"><br><br>

        <button type="submit">Garantir meu Teste 🎸</button>
    </form>

</body>
</html>
